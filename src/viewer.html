<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/assets/aercast-icon.png">
<title>Aercast</title>
<style>
  :root { color-scheme: dark; }
  html, body, video { width: 100%; height: 100%; }
  body { margin: 0; overflow: hidden; background: #000; }
  video { display: block; object-fit: contain; background: #000; }
</style>
<video playsinline></video>
<script>
  const video = document.querySelector("video");
  const MUTED_KEY = "aercast-viewer-muted";
  let preferredMuted = false;
  try { preferredMuted = localStorage.getItem(MUTED_KEY) === "true"; } catch (_) {}
  let policyMuted = null;
  let running = true;
  let blockedByHost = false;
  let retrying = false;
  let automaticPlay = false;
  let currentAttempt = null;
  let heldSource = null;
  let permittedSeek = null;
  const setMutedByPolicy = muted => {
    if (video.muted === muted) return;
    policyMuted = muted;
    video.muted = muted;
  };
  const seekTo = time => {
    permittedSeek = time;
    video.currentTime = time;
  };
  const createViewerId = () => Array.from(
    crypto.getRandomValues(new Uint8Array(16)),
    byte => byte.toString(16).padStart(2, "0")
  ).join("");
  let viewerId = createViewerId();
  try {
    const stored = localStorage.getItem("aercast-viewer-id");
    if (/^[0-9a-f]{32}$/.test(stored ?? "")) viewerId = stored;
    else localStorage.setItem("aercast-viewer-id", viewerId);
  } catch (_) {
    viewerId = createViewerId();
  }

  const tabId = createViewerId();
  let sessionChannel = null;
  try {
    sessionChannel = new BroadcastChannel("aercast-viewer-session");
    sessionChannel.onmessage = ({ data }) => {
      if (data?.type === "claim" && data.tabId !== tabId) {
        if (running) {
          running = false;
          document.body.dataset.state = "inactive";
          video.pause();
          if (currentAttempt) {
            void stopAttempt(currentAttempt);
          }
          console.info("Playback transferred to another tab; press Play to resume here.");
        }
      }
    };
  } catch (_) {}

  function claimSession() {
    try {
      sessionChannel?.postMessage({ type: "claim", tabId });
    } catch (_) {}
  }

  function showError(error) {
    console.error("Viewer error:", error);
    document.body.dataset.state = "error";
    document.body.dataset.error = error.message ?? String(error);
  }

  function mutate(buffer, action) {
    return new Promise((resolve, reject) => {
      const cleanup = () => {
        buffer.removeEventListener("updateend", done);
        buffer.removeEventListener("error", failed);
      };
      const done = () => { cleanup(); resolve(); };
      const failed = () => { cleanup(); reject(new Error("SourceBuffer update failed")); };
      buffer.addEventListener("updateend", done);
      buffer.addEventListener("error", failed);
      try { action(); } catch (error) { cleanup(); reject(error); }
    });
  }

  async function trim(buffer, force) {
    if (!buffer.buffered.length) return false;
    const start = buffer.buffered.start(0);
    const end = buffer.buffered.end(buffer.buffered.length - 1);
    const cutoff = video.currentTime - 5;
    if (cutoff <= start || (!force && end - start < 15)) return false;
    await mutate(buffer, () => buffer.remove(start, cutoff));
    return true;
  }

  async function append(buffer, chunk) {
    try {
      await mutate(buffer, () => buffer.appendBuffer(chunk));
    } catch (error) {
      if (error.name !== "QuotaExceededError" || !await trim(buffer, true)) throw error;
      await mutate(buffer, () => buffer.appendBuffer(chunk));
    }
    await trim(buffer, false);
  }

  function delay(milliseconds) {
    return new Promise(resolve => setTimeout(resolve, milliseconds));
  }

  function withAbort(promise, signal) {
    if (signal.aborted) return Promise.reject(signal.reason ?? new Error("Stream aborted"));
    return new Promise((resolve, reject) => {
      const aborted = () => { cleanup(); reject(signal.reason ?? new Error("Stream aborted")); };
      const cleanup = () => signal.removeEventListener("abort", aborted);
      signal.addEventListener("abort", aborted, { once: true });
      promise.then(
        value => { cleanup(); resolve(value); },
        error => { cleanup(); reject(error); }
      );
    });
  }

  async function reportTelemetry(buffer, signal) {
    let rtt = null;
    while (!signal.aborted) {
      try {
        await withAbort(delay(2000), signal);
        if (!buffer.buffered.length) continue;
        const lag = Math.min(60000, Math.max(0, Math.round(
          (buffer.buffered.end(buffer.buffered.length - 1) - video.currentTime) * 1000
        )));
        const started = performance.now();
        const response = await fetch(`${location.pathname}/telemetry`, {
          method: "POST",
          cache: "no-store",
          headers: {
            "Aercast-Viewer-ID": viewerId,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ rtt_ms: rtt, playback_lag_ms: lag }),
          signal
        });
        if (!response.ok) return;
        rtt = Math.min(60000, Math.round(performance.now() - started));
      } catch (_) {
        if (signal.aborted) return;
      }
    }
  }

  function beginAttempt() {
    const controller = new AbortController();
    const media = new MediaSource();
    const opened = new Promise(resolve => media.addEventListener("sourceopen", resolve, { once: true }));
    const attempt = {
      controller,
      media,
      opened,
      source: URL.createObjectURL(media),
      response: null,
      reader: null,
      error: null
    };
    currentAttempt = attempt;
    video.controls = false;
    video.src = attempt.source;
    return attempt;
  }

  async function playAutomatically(attempt) {
    automaticPlay = true;
    try {
      await video.play();
    } catch (error) {
      if (attempt.controller.signal.aborted) return;
      if (!video.muted) {
        console.info("Unmuted autoplay was blocked; retrying muted.");
        setMutedByPolicy(true);
        try {
          await video.play();
          return;
        } catch (mutedError) {
          error = mutedError;
        }
      }
      showError(error);
    } finally {
      automaticPlay = false;
    }
  }

  function releaseHeldSource() {
    if (!heldSource) return;
    if (video.src === heldSource) {
      video.removeAttribute("src");
      video.load();
    }
    URL.revokeObjectURL(heldSource);
    heldSource = null;
  }

  async function stopAttempt(attempt) {
    attempt.controller.abort();
    try {
      if (attempt.reader) await attempt.reader.cancel();
      else if (attempt.response?.body) await attempt.response.body.cancel();
    } catch (_) {}
    if (currentAttempt === attempt) currentAttempt = null;
    if (blockedByHost && video.src === attempt.source) {
      video.pause();
      heldSource = attempt.source;
    } else {
      if (video.src === attempt.source) {
        video.removeAttribute("src");
        video.load();
      }
      URL.revokeObjectURL(attempt.source);
    }
  }

  async function nextResponse(attempt) {
    while (running) {
      const response = await fetch(`${location.pathname}/stream`, {
        cache: "no-store",
        headers: { "Aercast-Viewer-ID": viewerId },
        signal: attempt.controller.signal
      });
      if (response.status !== 425) return response;
      if (response.body) await response.body.cancel();
      document.body.dataset.state = "waiting";
      await delay(500);
    }
    throw new Error("Share stopped");
  }

  async function consume(attempt, response, mime) {
    await withAbort(attempt.opened, attempt.controller.signal);
    const buffer = attempt.media.addSourceBuffer(mime);
    void reportTelemetry(buffer, attempt.controller.signal);
    const reader = response.body.getReader();
    attempt.reader = reader;
    let positioned = false;

    while (true) {
      const { done, value } = await withAbort(reader.read(), attempt.controller.signal);
      if (done) break;
      await withAbort(append(buffer, value), attempt.controller.signal);
      if (buffer.buffered.length) {
        const range = buffer.buffered.length - 1;
        const start = buffer.buffered.start(range);
        const end = buffer.buffered.end(range);
        if (!positioned || end - video.currentTime > 0.35) {
          seekTo(Math.max(start, end - 0.15));
        }
        if (!positioned) {
          positioned = true;
          setMutedByPolicy(preferredMuted);
          video.controls = true;
          await playAutomatically(attempt);
        }
      }
    }
    if (attempt.media.readyState === "open" && !buffer.updating) attempt.media.endOfStream();
  }

  async function connect(attempt) {
    claimSession();
    while (running) {
      document.body.dataset.state = "connecting";
      delete document.body.dataset.error;
      try {
        const response = await nextResponse(attempt);
        attempt.response = response;
        if (response.status === 404) {
          if (response.body) await response.body.cancel();
          attempt.response = null;
          running = false;
          document.body.dataset.state = "ended";
          console.warn("This share has ended or the link is invalid.");
          return;
        }
        if (response.status === 409) {
          if (response.body) await response.body.cancel();
          attempt.response = null;
          running = false;
          blockedByHost = true;
          document.body.dataset.state = "blocked";
          console.warn("Disconnected by the Host; use the native Play control to retry.");
          return;
        }
        if (!response.ok || !response.body) {
          throw new Error(`Stream request failed: HTTP ${response.status}`);
        }
        const mime = response.headers.get("content-type");
        if (!mime || !MediaSource.isTypeSupported(mime)) {
          running = false;
          console.error("Unsupported Viewer media type:", mime ?? "missing");
          throw new Error("This browser cannot play the shared media.");
        }
        console.log("Viewer media type:", mime);
        await consume(attempt, response, mime);
        if (running) {
          document.body.dataset.state = "reconnecting";
          console.warn("Viewer stream ended; reconnecting.");
        }
      } catch (error) {
        const cause = attempt.error ?? error;
        if (!running) {
          showError(cause);
          return;
        }
        document.body.dataset.state = "reconnecting";
        document.body.dataset.error = cause.message;
        console.warn("Viewer reconnecting:", cause);
      } finally {
        await stopAttempt(attempt);
      }
      if (!running) return;
      await delay(500);
      attempt = beginAttempt();
    }
  }

  async function retryBlocked() {
    if (!blockedByHost || retrying) return;
    retrying = true;
    document.body.dataset.state = "retrying";
    delete document.body.dataset.error;
    try {
      const response = await fetch(`${location.pathname}/retry`, {
        method: "POST",
        cache: "no-store",
        headers: { "Aercast-Viewer-ID": viewerId }
      });
      if (response.status === 404) {
        blockedByHost = false;
        document.body.dataset.state = "ended";
        console.warn("This share has ended or the link is invalid.");
        releaseHeldSource();
        return;
      }
      if (!response.ok) throw new Error(`Retry failed: HTTP ${response.status}`);
      blockedByHost = false;
      releaseHeldSource();
      running = true;
      void connect(beginAttempt());
    } catch (error) {
      showError(error);
    } finally {
      retrying = false;
    }
  }

  video.addEventListener("playing", () => {
    document.body.dataset.state = "playing";
    delete document.body.dataset.error;
  });
  video.addEventListener("play", () => {
    if (automaticPlay || retrying) return;
    if (blockedByHost) {
      video.pause();
      void retryBlocked();
      return;
    }
    if (!running) {
      video.pause();
      running = true;
      void connect(beginAttempt());
    }
  });
  video.addEventListener("volumechange", () => {
    if (policyMuted === video.muted) {
      policyMuted = null;
      return;
    }
    policyMuted = null;
    preferredMuted = video.muted;
    try { localStorage.setItem(MUTED_KEY, String(preferredMuted)); } catch (_) {}
  });
  video.addEventListener("seeking", () => {
    if (permittedSeek !== null && Math.abs(video.currentTime - permittedSeek) < 0.05) {
      permittedSeek = null;
      return;
    }
    if (!video.buffered.length) return;
    const range = video.buffered.length - 1;
    const start = video.buffered.start(range);
    const end = video.buffered.end(range);
    seekTo(Math.max(start, end - 0.1));
  });
  video.addEventListener("error", () => {
    const attempt = currentAttempt;
    if (!attempt) return;
    const message = video.error?.message ?? "Video playback failed";
    attempt.error = new Error(message);
    document.body.dataset.error = message;
    console.error("Viewer playback error:", attempt.error);
    attempt.controller.abort(attempt.error);
  });
  void connect(beginAttempt());
</script>
</html>
