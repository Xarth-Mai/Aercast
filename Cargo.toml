[package]
name = "aercast"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
futures-util = "0.3"
gst = { package = "gstreamer", version = "0.25" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
