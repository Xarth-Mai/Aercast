[package]
name = "aercast"
version = "0.1.3"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "settings", "tokio"] }
axum = "0.8"
futures-util = "0.3"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
iced = { version = "0.14", default-features = false, features = ["advanced", "wayland", "wgpu", "tokio", "svg"] }
ksni = "0.3.6"
png = "0.17"
pw = { package = "pipewire", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
