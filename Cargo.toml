[package]
name = "aercast"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
axum = "0.8"
futures-util = "0.3"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
iced = { version = "0.14", default-features = false, features = ["wayland", "wgpu", "tokio"] }
pw = { package = "pipewire", version = "0.10" }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
